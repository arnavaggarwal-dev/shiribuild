name: iOS Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest available Xcode
        run: |
          echo "--- installed Xcode versions ---"
          ls -d /Applications/Xcode*.app
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Selecting: $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project MyApp.xcodeproj \
            -scheme MyApp \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$PWD/build/MyApp.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package IPA
        run: |
          echo "--- archive contents ---"
          find build/MyApp.xcarchive -maxdepth 4
          mkdir -p Payload
          cp -r "build/MyApp.xcarchive/Products/Applications/Shiritori.app" Payload/
          zip -r MyApp.ipa Payload
          mkdir -p dist
          mv MyApp.ipa dist/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: dist/MyApp.ipa
